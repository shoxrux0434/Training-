<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировка">
<title>Тренировка A/B/C</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#111;color:#eee;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px);min-height:100vh}
button,input{font:inherit}
button{color:#eee;background:#292929;border:0;border-radius:12px;padding:13px;cursor:pointer;touch-action:manipulation}
button:active{opacity:.7}
h1{font-size:28px;margin:10px 0 16px}
h2{font-size:13px;color:#888;text-transform:uppercase;margin:22px 0 10px}
p{line-height:1.5}
.muted{color:#929292;font-size:14px}
.primary{background:#2f80ed;color:white;font-weight:700;font-size:18px;padding:17px;width:100%}
.day{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;margin-bottom:10px;gap:10px}
.day.next{outline:2px solid #2f80ed}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:12px}
.top button{padding:9px 12px;font-size:14px}
.card{background:#1c1c1c;border-radius:16px;padding:16px;margin-bottom:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:40px;padding:9px 0}
.dot.done{background:#1f6f43}
.dot.cur{outline:2px solid #2f80ed}
.ex{font-size:23px;font-weight:750;margin:8px 0 12px;line-height:1.25}
.set{font-size:34px;font-weight:800;margin:15px 0 8px}
.tip{margin-top:12px;color:#bbb;line-height:1.45}
.wu{margin-top:12px;padding:10px;background:#302810;color:#f2c94c;border-radius:10px;line-height:1.45}
.weight{display:flex;align-items:center;gap:10px;margin-top:15px;flex-wrap:wrap}
.weight input{width:115px;background:#292929;color:#fff;border:1px solid #444;border-radius:10px;padding:10px;text-align:center;font-size:20px}
.hint{font-size:12px;color:#888;margin-top:8px;line-height:1.5}
.anim{background:#151515;border-radius:14px;margin-bottom:12px;padding:8px;text-align:center}
.anim svg{width:100%;height:170px;display:block}
.animtxt{color:#f2c94c;font-weight:700;min-height:22px}
.cues{font-size:12px;color:#999;line-height:1.4;margin-top:5px}
.small{font-size:13px;padding:7px 11px;margin-top:8px}
.vid{display:block;text-align:center;text-decoration:none;color:#eee;background:#292929;border-radius:10px;padding:12px;margin-top:12px}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:#1c1c1c;border-radius:12px;padding:12px;text-align:center}
.stat strong{display:block;font-size:23px}
.hist{font-size:14px;color:#bbb;line-height:1.8}
#rest{position:fixed;z-index:10;inset:0;background:#111;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
#rest.on{display:flex}
#rest.over{animation:flash 1s infinite}
@keyframes flash{0%,100%{background:#1f6f43}50%{background:#287e4d}}
.clock{font-size:88px;font-weight:800;font-variant-numeric:tabular-nums;margin:15px 0}
#rest button{min-height:48px}
.hidden{display:none!important}
.footer{color:#666;font-size:12px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest"></div>

<script>
'use strict';

/* ===================== ПРОГРАММА ===================== */

const PLAN = {
 A:{
  name:'День A',
  ex:[
   {n:'Присед в Смите',s:3,r:'8–10',rir:'1–2',rest:150,wu:'Разминочные подходы перед рабочим весом',t:'Стопы устойчиво. Опускайся контролируемо, колени направляй по линии носков.'},
   {n:'Жим гантелей на наклонной 30°',s:3,r:'8–10',rir:'1–2',rest:150,wu:'1–2 разминочных подхода',t:'Лопатки сведены. Опускай гантели до комфортного растяжения груди без боли в плечах.'},
   {n:'Тяга верхнего блока нейтральным хватом',s:3,r:'8–12',rir:'1–2',rest:120,t:'Тяни локти вниз. Не раскачивай корпус. В верхней точке дай широчайшим растянуться.'},
   {n:'Сгибание ног сидя',s:3,r:'10–15',rir:'1–2',rest:90,t:'Контролируй обе фазы движения, не бросай вес.'},
   {n:'Разведения гантелей в стороны',s:3,r:'12–20',rir:'1–2',rest:75,t:'Поднимай локти примерно до уровня плеч. Не раскачивай корпус.'},
   {n:'Разгибание рук на блоке вниз',s:2,r:'10–15',rir:'1–2',rest:75,t:'Локти близко к корпусу. Разгибай руки без раскачки плечами.'},
   {n:'Икры в жиме ногами',s:2,r:'12–20',rir:'1–2',rest:60,t:'Полная амплитуда, пауза в растяжении и в верхней точке.'}
  ]
 },
 B:{
  name:'День B',
  ex:[
   {n:'Румынская тяга со штангой',s:3,r:'6–10',rir:'2',rest:180,wu:'Сделай несколько лёгких разминочных подходов',t:'Отводи таз назад. Спина нейтральная, гриф близко к ногам. Останавливайся при сильном натяжении задней поверхности бедра.'},
   {n:'Жим в Хаммере на грудь',s:3,r:'8–12',rir:'1–2',rest:150,wu:'1–2 разминочных подхода',t:'Лопатки устойчивы, опускай рукояти контролируемо. Не выпрямляй локти резко.'},
   {n:'Горизонтальная тяга к поясу',s:3,r:'8–12',rir:'1–2',rest:120,t:'Тяни локти назад, грудь держи приподнятой. Не превращай движение в раскачивание корпуса.'},
   {n:'Разгибание ног в тренажёре',s:3,r:'10–15',rir:'1–2',rest:90,t:'Поднимай вес плавно, контролируй опускание.'},
   {n:'Сгибание рук на наклонной скамье',s:2,r:'10–15',rir:'1–2',rest:75,t:'Не раскачивай плечами. Опускай гантели подконтрольно.'},
   {n:'Разведения гантелей в стороны',s:3,r:'12–20',rir:'1–2',rest:75,t:'Локти чуть согнуты, без рывков и раскачки.'},
   {n:'Скручивания на скамье',s:2,r:'12–20',rir:'1–2',rest:60,t:'Скручивай грудную клетку к тазу. Не тяни шею руками.'}
  ]
 },
 C:{
  name:'День C',
  ex:[
   {n:'Жим ногами',s:3,r:'8–12',rir:'1–2',rest:150,wu:'1–2 разминочных подхода',t:'Опускай платформу настолько глубоко, насколько позволяет положение таза без отрыва от спинки.'},
   {n:'Жим гантелей на наклонной 30°',s:3,r:'8–12',rir:'1–2',rest:150,wu:'Лёгкий разминочный подход',t:'Контролируй опускание. Не отбивай гантели и не проваливай плечи вперёд.'},
   {n:'Подтягивания или тяга верхнего блока',s:3,r:'8–12',rir:'1–2',rest:120,t:'Полная контролируемая амплитуда. Если подтягивания пока слишком тяжёлые, используй верхний блок.'},
   {n:'Хаммер: тяга от груди',s:3,r:'8–12',rir:'1–2',rest:120,t:'Грудь прижата к упору. В конце движения сведи лопатки, затем медленно верни рукояти.'},
   {n:'Бабочка на грудь',s:2,r:'12–15',rir:'1–2',rest:75,t:'Раскрывай руки до комфортного растяжения, не допускай боли в плечах.'},
   {n:'Сгибание ног сидя',s:2,r:'10–15',rir:'1–2',rest:90,t:'Работай без рывков, контролируй возвращение веса.'},
   {n:'Обратная бабочка',s:3,r:'12–20',rir:'1–2',rest:75,t:'Разводи руки в стороны, не поднимай плечи к ушам.'},
   {n:'Одноручное разгибание на блоке',s:2,r:'10–15',rir:'1–2',rest:60,t:'Локоть держи устойчиво. Выполни подходы на обе руки.'}
  ]
 }
};

/* ===================== СОХРАНЕНИЕ ===================== */

const $ = id => document.getElementById(id);

function readStore(key, fallback){
 try{
  const value = localStorage.getItem(key);
  return value === null ? fallback : JSON.parse(value);
 }catch(e){return fallback;}
}
function writeStore(key, value){
 try{localStorage.setItem(key,JSON.stringify(value));}
 catch(e){console.warn('Не удалось сохранить данные',e);}
}

let S = readStore('workout_state_v3',null);
let restMode = '';
let audioContext = null;
let wakeLock = null;

function saveState(){writeStore('workout_state_v3',S);}
function getWeight(name){return readStore('weight:'+name,'');}
function setWeight(name,value){writeStore('weight:'+name,value);}

function fmt(seconds){
 seconds=Math.max(0,Math.ceil(seconds));
 return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
}
function dateLabel(value){
 return new Date(value).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
}
function durationLabel(seconds){
 const mins=Math.max(0,Math.round(seconds/60));
 return mins+' мин';
}

/* ===================== ЗВУК И ЭКРАН ===================== */

function unlockAudio(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioContext)audioContext=new AC();
  if(audioContext.state==='suspended')audioContext.resume();
 }catch(e){}
}
document.addEventListener('click',unlockAudio);
document.addEventListener('touchend',unlockAudio,{passive:true});

function beep(){
 try{
  if(!audioContext)return;
  [0,.3,.6].forEach(delay=>{
   const oscillator=audioContext.createOscillator();
   const gain=audioContext.createGain();
   oscillator.frequency.value=880;
   oscillator.connect(gain);
   gain.connect(audioContext.destination);
   const start=audioContext.currentTime+delay;
   gain.gain.setValueAtTime(.001,start);
   gain.gain.exponentialRampToValueAtTime(.25,start+.02);
   gain.gain.exponentialRampToValueAtTime(.001,start+.25);
   oscillator.start(start);
   oscillator.stop(start+.27);
  });
 }catch(e){}
}

async function keepAwake(){
 try{
  if('wakeLock' in navigator && !wakeLock && S){
   wakeLock=await navigator.wakeLock.request('screen');
   wakeLock.addEventListener('release',()=>{wakeLock=null;});
  }
 }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'){
  keepAwake();
  tick();
 }
});

/* ===================== СОСТОЯНИЕ ТРЕНИРОВКИ ===================== */

function startWorkout(day){
 if(S && !confirm('Текущая тренировка не завершена. Начать новую?'))return;
 const count=PLAN[day].ex.length;
 S={
  day:day,
  i:0,
  done:Array(count).fill(0),
  t0:Date.now(),
  restEnd:null,
  beeped:false,
  label:''
 };
 saveState();
 keepAwake();
 renderWorkout();
}

function validState(){
 if(!S || !PLAN[S.day])return false;
 const count=PLAN[S.day].ex.length;
 if(!Array.isArray(S.done))S.done=Array(count).fill(0);
 if(S.done.length!==count){
  S.done=Array.from({length:count},(_,i)=>Math.min(S.done[i]||0,PLAN[S.day].ex[i].s));
 }
 S.i=Math.max(0,Math.min(Number(S.i)||0,count-1));
 if(!S.t0)S.t0=Date.now();
 return true;
}

function getHistory(){return readStore('workout_history_v3',[]);}
function nextDay(){
 const history=getHistory();
 if(!history.length)return 'A';
 const last=history[history.length-1];
 return ({A:'B',B:'C',C:'A'})[last.day]||'A';
}

function home(){
 const history=getHistory();
 const next=nextDay();
 let html='<h1>Тренировка</h1>';

 if(S && validState()){
  html+=`<button class="primary" onclick="renderWorkout()">Продолжить: ${PLAN[S.day].name}</button>`;
  html+='<h2>Или начать другую</h2>';
 }else{
  html+=`<p class="muted" style="margin-bottom:14px">Следующая по очереди: <b style="color:#eee">${PLAN[next].name}</b></p>`;
 }

 for(const day of ['A','B','C']){
  const plan=PLAN[day];
  const last=[...history].reverse().find(item=>item.day===day);
  const sets=plan.ex.reduce((sum,e)=>sum+e.s,0);
  html+=`<button class="day ${!S&&day===next?'next':''}" onclick="startWorkout('${day}')">
   <span><b>${plan.name}</b><br><span class="muted">${plan.ex.length} упражнений · ${sets} подходов</span></span>
   <span class="muted">${last?dateLabel(last.date):'Не было'}</span>
  </button>`;
 }

 html+=`<div class="stats">
  <div class="stat"><strong>${history.length}</strong><span class="muted">Тренировок</span></div>
  <div class="stat"><strong>${history.reduce((sum,h)=>sum+(h.done||0),0)}</strong><span class="muted">Подходов</span></div>
 </div>`;

 if(history.length){
  html+='<h2>История тренировок</h2><div class="card hist">';
  history.slice(-15).reverse().forEach(item=>{
   html+=`${dateLabel(item.date)} — ${PLAN[item.day]?.name||item.day}<br>`;
   html+=`<span class="muted">${item.done}/${item.total} подходов · ${item.min} мин</span><br>`;
  });
  html+='</div>';
  html+='<div class="row"><button onclick="exportHistory()">Экспорт данных</button><button onclick="clearHistory()">Очистить историю</button></div>';
 }
 html+='<p class="footer">Данные хранятся в этом браузере на этом устройстве.</p>';
 $('app').innerHTML=html;
 $('rest').className='';
 restMode='';
}

function currentExercise(){
 return PLAN[S.day].ex[S.i];
}

/* ===================== ОТРИСОВКА ===================== */

function renderWorkout(){
 if(!validState()){home();return;}
 const plan=PLAN[S.day];
 const e=currentExercise();
 const completed=S.done[S.i]||0;
 const allDone=completed>=e.s;
 const weight=getWeight(e.n);

 let html=`<div class="top">
  <button onclick="home()">‹ Меню</button>
  <span class="muted" id="elapsed"></span>
  <button onclick="finishWorkout(false)">Завершить</button>
 </div>`;

 html+='<div class="dots">';
 plan.ex.forEach((exercise,index)=>{
  const isDone=(S.done[index]||0)>=exercise.s;
  html+=`<button class="dot ${isDone?'done':''} ${index===S.i?'cur':''}" onclick="goExercise(${index})">${index+1}</button>`;
 });
 html+='</div>';

 html+='<div class="card">';
 html+=`<div class="muted">${plan.name} · упражнение ${S.i+1} из ${plan.ex.length}</div>`;
 html+=`<div class="ex">${e.n}</div>`;
 html+=renderAnimation(e.n);

 if(allDone){
  html+='<div class="set" style="color:#4caf50">Готово ✓</div>';
 }else{
  html+=`<div class="set">Подход ${completed+1} из ${e.s}</div>`;
 }
 html+=`<p>Повторы: <b>${e.r}</b> · запас до отказа: <b>${e.rir}</b></p>`;
 html+=`<p class="muted" style="margin-top:5px">Отдых между подходами: ${fmt(e.rest)}</p>`;

 if(e.wu && completed===0){
  html+=`<div class="wu">Разминка: ${e.wu}</div>`;
 }
 html+=`<div class="tip">${e.t}</div>`;
 html+=`<a class="vid" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.n+' техника выполнения')}" target="_blank" rel="noopener">▶ Посмотреть технику</a>`;
 html+=`<div class="weight"><label for="workingWeight">Рабочий вес, кг</label><input id="workingWeight" type="number" inputmode="decimal" min="0" step="0.5" value="${escapeAttr(weight)}" onchange="saveCurrentWeight(this.value)"></div>`;
 html+='<div class="hint">Записывай вес, используемый в рабочих подходах. Если достиг верхней границы повторов с хорошей техникой, постепенно увеличивай нагрузку.</div>';
 html+='</div>';

 if(allDone){
  html+='<button class="primary" onclick="nextExercise()">Следующее упражнение</button>';
 }else{
  html+='<button class="primary" onclick="completeSet()">Подход выполнен ✓</button>';
 }
 html+='<div class="row" style="margin-top:10px">';
 html+='<button onclick="goExercise(S.i-1)">‹ Назад</button>';
 html+='<button onclick="nextExercise()">Пропустить / дальше ›</button>';
 html+='</div>';

 $('app').innerHTML=html;
 tick();
}

function escapeAttr(value){
 return String(value??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function saveCurrentWeight(value){
 const number=String(value).trim();
 if(number!=='' && (!Number.isFinite(Number(number)) || Number(number)<0)){
  alert('Введи корректный вес.');
  return;
 }
 setWeight(currentExercise().n,number===''?'':Number(number));
}

/* Простая встроенная анимация-иллюстрация, не требующая внешних файлов. */
function renderAnimation(name){
 const backExercises=/тяга|подтягивания|бабочка|разведения/i.test(name);
 const arms=backExercises
  ?'<line x1="130" y1="80" x2="108" y2="120"/><line x1="230" y1="80" x2="252" y2="120"/>'
  :'<line x1="130" y1="80" x2="110" y2="112"/><line x1="230" y1="80" x2="250" y2="112"/>';
 return `<div class="anim">
  <svg viewBox="0 0 360 180" role="img" aria-label="Схематичная иллюстрация упражнения">
   <line x1="35" y1="157" x2="325" y2="157" stroke="#383838" stroke-width="2"/>
   <circle cx="180" cy="34" r="13" fill="#eee"/>
   <line x1="180" y1="48" x2="180" y2="100" stroke="#eee" stroke-width="10" stroke-linecap="round"/>
   ${arms}
   <line x1="180" y1="100" x2="150" y2="143" stroke="#eee" stroke-width="10" stroke-linecap="round"/>
   <line x1="180" y1="100" x2="210" y2="143" stroke="#eee" stroke-width="10" stroke-linecap="round"/>
   <circle cx="105" cy="119" r="7" fill="#e8743b"/>
   <circle cx="255" cy="119" r="7" fill="#e8743b"/>
   <text x="180" y="174" fill="#777" text-anchor="middle" font-size="10">${backExercises?'КОНТРОЛИРУЙ ДВИЖЕНИЕ':'СТАБИЛЬНОЕ ПОЛОЖЕНИЕ'}</text>
  </svg>
  <div class="animtxt">${backExercises?'Контроль движения и положения лопаток':'Плавное движение без рывков'}</div>
  <div class="cues">Иллюстрация схематичная. Подробные подсказки по технике указаны ниже.</div>
 </div>`;
}

/* ===================== ПОДХОДЫ И ПЕРЕХОДЫ ===================== */

function goExercise(index){
 if(!validState())return;
 if(index<0||index>=PLAN[S.day].ex.length)return;
 S.i=index;
 saveState();
 renderWorkout();
}

function nextIncompleteIndex(){
 const exercises=PLAN[S.day].ex;
 for(let step=1;step<=exercises.length;step++){
  const index=(S.i+step)%exercises.length;
  if((S.done[index]||0)<exercises[index].s)return index;
 }
 return -1;
}

function nextExercise(){
 const next=nextIncompleteIndex();
 if(next===-1){
  finishWorkout(true);
  return;
 }
 S.i=next;
 saveState();
 renderWorkout();
}

function completeSet(){
 if(!validState())return;
 const e=currentExercise();
 if(S.done[S.i]>=e.s)return;

 S.done[S.i]++;
 const currentDone=S.done[S.i];
 const allSetsDone=S.done.every((count,index)=>count>=PLAN[S.day].ex[index].s);

 if(allSetsDone){
  saveState();
  finishWorkout(true);
  return;
 }

 const next=nextIncompleteIndex();
 if(currentDone>=e.s && next!==-1){
  S.label='Далее: '+PLAN[S.day].ex[next].n;
 }else{
  S.label='Следующий подход: '+(currentDone+1)+' из '+e.s;
 }

 S.restEnd=Date.now()+e.rest*1000;
 S.beeped=false;
 saveState();
 renderWorkout();
 showRest();
}

/* ===================== ТАЙМЕР ОТДЫХА ===================== */

function showRest(){
 if(!S || !S.restEnd)return;
 const remaining=(S.restEnd-Date.now())/1000;
 const over=remaining<=0;
 const panel=$('rest');
 const mode=over?'over':'run';

 if(mode!==restMode){
  restMode=mode;
  panel.className='on'+(over?' over':'');
  panel.innerHTML=`
   <div style="font-size:22px">${over?'Отдых окончен':'Отдых'}</div>
   <div class="clock" id="restClock">${over?'+'+fmt(-remaining):fmt(remaining)}</div>
   <div style="font-size:18px;margin-bottom:25px" id="restLabel"></div>
   ${over
    ?'<button class="primary" onclick="endRest()">Продолжить</button>'
    :'<div class="row"><button onclick="adjustRest(-15)">−15 сек</button><button onclick="adjustRest(15)">+15 сек</button></div><button style="width:100%;margin-top:10px" onclick="endRest()">Пропустить отдых</button>'}
  `;
 }
 const clock=$('restClock');
 const label=$('restLabel');
 if(clock)clock.textContent=over?'+'+fmt(-remaining):fmt(remaining);
 if(label)label.textContent=S.label||'Время следующего подхода';

 if(over && !S.beeped){
  S.beeped=true;
  saveState();
  beep();
 }
}

function adjustRest(seconds){
 if(!S || !S.restEnd)return;
 S.restEnd=Math.max(Date.now(),S.restEnd+seconds*1000);
 restMode='';
 saveState();
 showRest();
}

function endRest(){
 if(!S)return;
 S.restEnd=null;
 S.beeped=false;
 restMode='';
 saveState();
 $('rest').className='';
 renderWorkout();
}

function tick(){
 if(!S)return;
 const elapsed=$('elapsed');
 if(elapsed)elapsed.textContent=durationLabel((Date.now()-S.t0)/1000);
 if(S.restEnd){
  showRest();
 }else{
  const panel=$('rest');
  if(panel)panel.className='';
  restMode='';
 }
}
setInterval(tick,250);

/* ===================== ЗАВЕРШЕНИЕ И ИСТОРИЯ ===================== */

function finishWorkout(automatic){
 if(!S)return;
 if(!automatic && !confirm('Завершить тренировку и сохранить результат?'))return;

 const plan=PLAN[S.day];
 const total=plan.ex.reduce((sum,e)=>sum+e.s,0);
 const done=S.done.reduce((sum,count)=>sum+count,0);
 const minutes=Math.round((Date.now()-S.t0)/60000);
 const result={
  day:S.day,
  date:new Date().toISOString(),
  min:minutes,
  done:done,
  total:total,
  weights:plan.ex.map(e=>({name:e.n,weight:getWeight(e.n)}))
 };

 if(done>0){
  const history=getHistory();
  history.push(result);
  writeStore('workout_history_v3',history.slice(-100));
 }

 S=null;
 saveState();

 if(wakeLock){
  try{wakeLock.release();}catch(e){}
  wakeLock=null;
 }
 $('rest').className='';
 restMode='';

 $('app').innerHTML=`
  <h1>Тренировка завершена</h1>
  <div class="card">
   <div class="ex">${plan.name}</div>
   <div class="stats">
    <div class="stat"><strong>${done}/${total}</strong><span class="muted">Подходов</span></div>
    <div class="stat"><strong>${minutes}</strong><span class="muted">Минут</span></div>
   </div>
   <p class="muted">Результат сохранён в истории, если был выполнен хотя бы один подход.</p>
  </div>
  <button class="primary" onclick="home()">В меню</button>
 `;
}

function exportHistory(){
 const data={
  history:getHistory(),
  weights:Object.fromEntries(
   Object.keys(localStorage)
    .filter(key=>key.startsWith('weight:'))
    .map(key=>[key,readStore(key,'')])
  )
 };
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='trenirovki-backup.json';
 a.click();
 URL.revokeObjectURL(url);
}

function clearHistory(){
 if(!confirm('Удалить всю историю тренировок? Рабочие веса останутся.'))return;
 writeStore('workout_history_v3',[]);
 home();
}

/* ===================== ЗАПУСК ===================== */

if(S && validState()){
 saveState();
 keepAwake();
 renderWorkout();
}else{
 S=null;
 saveState();
 home();
}
</script>
</body>
</html>
