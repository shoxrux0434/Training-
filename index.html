

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#10130f">

<title>SHOX WORKOUT</title>

<style>

:root {

  --bg:#10130f; --panel:#1a2019; --panel2:#222a20;

  --lime:#c5f36b; --text:#f2f4ed; --muted:#9ba596;

  --line:#303a2c; --red:#ff7777;

}

*{box-sizing:border-box}

body{

  margin:0;background:var(--bg);color:var(--text);

  font-family:Inter,Arial,sans-serif;padding:20px;

}

header{max-width:950px;margin:0 auto 22px}

.brand{font-size:12px;color:var(--lime);letter-spacing:4px;font-weight:800}

h1{font-size:30px;margin:8px 0}

.subtitle{color:var(--muted);font-size:13px}

main{max-width:950px;margin:auto}

.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}

.tab{

  flex:1;min-width:90px;padding:13px;border:1px solid var(--line);

  background:var(--panel);color:var(--text);border-radius:12px;

  font-weight:700;cursor:pointer

}

.tab.active{background:var(--lime);color:#17200e;border-color:var(--lime)}

.summary{

  background:var(--panel);padding:16px;border:1px solid var(--line);

  border-radius:15px;margin-bottom:15px

}

.progress{height:7px;background:#303a2c;border-radius:10px;margin-top:12px;overflow:hidden}

.progress span{display:block;height:100%;width:0;background:var(--lime);transition:.25s}

.exercise{

  background:var(--panel);border:1px solid var(--line);

  border-radius:15px;padding:16px;margin-bottom:12px

}

.exercise h3{font-size:16px;margin:0 0 7px}

.meta{font-size:12px;color:var(--muted);margin-bottom:12px}

.sets{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}

.set{

  display:flex;align-items:center;gap:6px;background:var(--panel2);

  padding:8px 10px;border-radius:9px;font-size:12px

}

.set input{accent-color:var(--lime);width:17px;height:17px}

.weight{display:flex;align-items:center;gap:8px;margin-top:12px}

.weight input{

  width:85px;padding:9px;border-radius:8px;border:1px solid var(--line);

  background:#10130f;color:white;font-size:14px

}

.small{font-size:12px;color:var(--muted)}

.details{

  margin-top:13px;border-top:1px solid var(--line);padding-top:12px

}

details summary{cursor:pointer;color:var(--lime);font-size:13px;font-weight:700}

.guide{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:13px}

.visual{

  background:radial-gradient(circle at 50% 35%,#394432,#151b14 70%);

  border-radius:12px;min-height:220px;display:flex;align-items:center;

  justify-content:center;position:relative;overflow:hidden

}

.visual svg{width:100%;max-width:210px;height:210px}

.figure{transform-origin:100px 110px;animation:breathe 2.8s ease-in-out infinite}

.muscle{fill:#ff744f;filter:drop-shadow(0 0 5px #ff744f)}

.joint{fill:#e9e9d8}

@keyframes breathe{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}

.muscles{font-size:11px;color:var(--lime);margin-top:8px}

.guide h4{margin:2px 0 8px;font-size:13px}

.guide p,.guide li{font-size:12px;line-height:1.55;color:#c4cbbd}

.guide ul{padding-left:17px;margin:5px 0}

.superset{

  border:1px solid #657d39;border-radius:14px;padding:13px;margin-bottom:14px;

  background:#1b2418

}

.superset-title{color:var(--lime);font-size:12px;font-weight:800;margin-bottom:10px}

.timer{

  position:sticky;bottom:10px;z-index:5;background:#20291d;

  border:1px solid #52683a;border-radius:15px;padding:14px;

  max-width:950px;margin:22px auto 0;display:flex;gap:12px;

  align-items:center;justify-content:space-between;flex-wrap:wrap

}

.time{font-size:28px;font-weight:800;color:var(--lime);font-variant-numeric:tabular-nums}

button{

  border:0;border-radius:9px;padding:10px 14px;font-weight:700;

  background:var(--lime);color:#18200f;cursor:pointer

}

button.secondary{background:#303a2c;color:white}

.timer select{

  background:#10130f;color:white;border:1px solid var(--line);

  border-radius:8px;padding:9px

}

@media(max-width:600px){

 body{padding:14px}.guide{grid-template-columns:1fr}

 .visual{min-height:190px}.timer{gap:8px}

}

</style>

</head>

<body>

<header>

  <div class="brand">SHOX / TRAINING SYSTEM</div>

  <h1>SHOX WORKOUT</h1>

  <div class="subtitle">Твоя программа тренировок · Пн / Ср / Пт</div>

</header>

<main>

  <div class="tabs">

    <button class="tab active" data-day="mon">ПОНЕДЕЛЬНИК</button>

    <button class="tab" data-day="wed">СРЕДА</button>

    <button class="tab" data-day="fri">ПЯТНИЦА</button>

  </div>

  <section class="summary">

    <div style="display:flex;justify-content:space-between;gap:10px">

      <b id="dayTitle">Понедельник</b>

      <span class="small" id="progressText">0 / 0 подходов</span>

    </div>

    <div class="progress"><span id="progressBar"></span></div>

  </section>

  <section id="workout"></section>

</main>

<div class="timer">

  <div>

    <div class="small">ТАЙМЕР ОТДЫХА</div>

    <div class="time" id="clock">01:30</div>

  </div>

  <select id="duration">

    <option value="60">60 секунд</option>

    <option value="90" selected>90 секунд</option>

    <option value="120">120 секунд</option>

    <option value="150">150 секунд</option>

  </select>

  <div style="display:flex;gap:7px">

    <button id="start">Старт</button>

    <button class="secondary" id="pause">Пауза</button>

    <button class="secondary" id="reset">Сброс</button>

  </div>

</div>

<script>

const workouts = {

mon:{

 title:"Понедельник",

 items:[

  ["Гиперэкстензия",4,12,"Скамья для гиперэкстензии","Разгибатели спины, ягодицы, задняя поверхность бедра"],

  ["Тяга верхнего блока нейтральным хватом",4,10,"Блочный тренажёр","Широчайшие мышцы спины, бицепс"],

  ["Жим плеч в тренажёре сидя",4,8,"Тренажёр для жима плеч","Передние и средние дельты, трицепс"],

  ["Жим гантелей лёжа",4,8,"Гантели + горизонтальная скамья","Грудные мышцы, трицепс, передние дельты"],

  ["Горизонтальная тяга блока к поясу",3,10,"Горизонтальный блочный тренажёр","Широчайшие, ромбовидные, задние дельты"],

  ["Сведение рук в тренажёре",3,12,"Pec Deck","Грудные мышцы"],

  ["Махи гантелями в стороны",4,15,"Гантели","Средние дельты"],

  ["Обратная бабочка",3,15,"Reverse Pec Deck","Задние дельты, мышцы верхней спины"],

  ["Подъём на носки",3,12,"Машина Смита, две ноги","Икроножные и камбаловидные мышцы"],

  ["Сгибание рук на наклонной скамье",3,10,"Гантели + наклонная скамья","Бицепс"],

  ["Разгибание рук на блоке",3,12,"Верхний блок с рукоятью","Трицепс"]

 ],

 supersets:[[9,10]]

},

wed:{

 title:"Среда",

 items:[

  ["Болгарские выпады",4,10,"Гантели + скамья","Квадрицепсы, ягодицы"],

  ["Жим гантелей на наклонной скамье 30°",4,10,"Гантели + наклонная скамья","Верхняя часть грудных мышц, трицепс"],

  ["Вертикальная тяга сидя",4,10,"Отдельный рычажный тренажёр с дисками","Широчайшие, ромбовидные, бицепс"],

  ["Тяга прямыми руками",3,12,"Кроссовер, верхний блок","Широчайшие мышцы"],

  ["Сгибание ног сидя",4,12,"Тренажёр для сгибания ног","Бицепс бедра"],

  ["Махи гантелями в стороны сидя",4,15,"Гантели + скамья","Средние дельты"],

  ["Французский жим",3,12,"Гантель или EZ-гриф","Трицепс"],

  ["Молотковые сгибания",3,12,"Гантели","Бицепс, плечевая мышца"]

 ],

 supersets:[[6,7]]

},

fri:{

 title:"Пятница",

 items:[

  ["Жим ногами",4,8,"Тренажёр для жима ногами","Квадрицепсы, ягодицы"],

  ["Подъём на носки",3,12,"Машина Смита, две ноги","Икроножные и камбаловидные мышцы"],

  ["Жим гантелей сидя",4,10,"Гантели + скамья","Передние и средние дельты, трицепс"],

  ["Тяга гантелей с упором грудью",4,10,"Наклонная скамья + гантели","Широчайшие, ромбовидные, задние дельты"],

  ["Жим от груди Hammer Strength",3,10,"Рычажный тренажёр","Грудные мышцы, трицепс"],

  ["Разгибание ног",3,12,"Тренажёр для разгибания ног","Квадрицепсы"],

  ["Сгибание ног сидя",4,12,"Тренажёр для сгибания ног","Бицепс бедра"],

  ["Махи гантелями в стороны",3,15,"Гантели","Средние дельты"],

  ["Сгибание рук в тренажёре",3,12,"Бицепс-машина","Бицепс"],

  ["Разгибание рук на блоке",3,12,"Верхний блок с рукоятью","Трицепс"]

 ],

 supersets:[[8,9]]

}

};

let currentDay="mon";

let remaining=90, interval=null;

function keyFor(day,index){return "shox_"+day+"_"+index}

function render(){

 const data=workouts[currentDay];

 document.getElementById("dayTitle").textContent=data.title;

 const root=document.getElementById("workout");

 root.innerHTML="";

 const paired=new Set();

 data.supersets.forEach(pair=>pair.forEach(i=>paired.add(i)));

 data.items.forEach((item,i)=>{

   if(paired.has(i)){

     const pair=data.supersets.find(p=>p.includes(i));

     if(pair[0]!==i)return;

     const box=document.createElement("div");

     box.className="superset";

     box.innerHTML='<div class="superset-title">СУПЕРСЕТ · БЕЗ ОТДЫХА МЕЖДУ УПРАЖНЕНИЯМИ</div>';

     pair.forEach((idx,n)=>box.appendChild(makeExercise(data.items[idx],idx,n===0?"A1":"A2")));

     root.appendChild(box);

   } else root.appendChild(makeExercise(item,i,""));

 });

 updateProgress();

}

function makeExercise(item,index,tag){

 const [name,sets,reps,equipment,muscles]=item;

 const el=document.createElement("article");

 el.className="exercise";

 el.innerHTML=`

  <h3>${tag?tag+" · ":""}${name}</h3>

  <div class="meta">${equipment}</div>

  <div class="small">${sets} подхода × ${reps} повторений</div>

  <div class="sets">

   ${Array.from({length:sets},(_,s)=>`

    <label class="set">

     <input type="checkbox" data-index="${index}" data-set="${s}">

     Подход ${s+1}

    </label>`).join("")}

  </div>

  <div class="weight">

   <span class="small">Рабочий вес:</span>

   <input type="number" min="0" step="0.5" placeholder="кг"

    data-weight="${index}">

   <span class="small">кг</span>

  </div>

  <div class="details">

   <details>

    <summary>Техника выполнения и работа мышц</summary>

    <div class="guide">

     <div>

      <div class="visual">

       <svg viewBox="0 0 200 220" aria-label="Схематичная фигура с выделенными мышцами">

        <g class="figure">

         <circle cx="100" cy="28" r="17" fill="#d6d9c9"/>

         <path d="M78 49 Q100 40 122 49 L132 100 L119 116 L116 154 L108 205 L94 205 L90 150 L85 205 L71 205 L79 150 L76 116 L68 100Z" fill="#9ca68f"/>

         <path d="M78 54 L56 66 L42 112 L51 116 L75 83Z" fill="#9ca68f"/>

         <path d="M122 54 L144 66 L158 112 L149 116 L125 83Z" fill="#9ca68f"/>

         <path class="muscle" d="M80 55 Q100 46 120 55 L116 79 Q100 89 84 79Z"/>

         <path class="muscle" d="M82 87 Q100 81 118 87 L115 111 Q100 119 85 111Z"/>

         <path d="M88 112 L98 114 L96 150 L86 150Z" fill="#9ca68f"/>

         <path d="M102 114 L112 112 L114 150 L104 150Z" fill="#9ca68f"/>

         <circle class="joint" cx="100" cy="112" r="3"/>

        </g>

       </svg>

      </div>

      <div class="muscles">Целевые мышцы: ${muscles}</div>

     </div>

     <div>

      <h4>Как выполнять</h4>

      <p>Двигайся контролируемо. Сохраняй устойчивое положение корпуса и не используй инерцию. Работай в комфортной амплитуде.</p>

      <h4>На что обратить внимание</h4>

      <ul>

       <li>Не делай резких рывков.</li>

       <li>Контролируй движение при возвращении веса.</li>

       <li>Не задерживай дыхание.</li>

      </ul>

      <h4>Оборудование</h4>

      <p>${equipment}</p>

     </div>

    </div>

   </details>

  </div>`;

 el.querySelectorAll("input[type=checkbox]").forEach(c=>{

  c.checked=localStorage.getItem(keyFor(currentDay,index)+"_"+c.dataset.set)==="1";

  c.addEventListener("change",()=>{

   localStorage.setItem(keyFor(currentDay,index)+"_"+c.dataset.set,c.checked?"1":"0");

   updateProgress();

  });

 });

 const weight=el.querySelector("[data-weight]");

 weight.value=localStorage.getItem("weight_"+currentDay+"_"+index)||"";

 weight.addEventListener("input",()=>localStorage.setItem("weight_"+currentDay+"_"+index,weight.value));

 return el;

}

function updateProgress(){

 const data=workouts[currentDay];

 let total=0,done=0;

 data.items.forEach((item,i)=>{

  total+=item[1];

  for(let s=0;s<item[1];s++){

   if(localStorage.getItem(keyFor(currentDay,i)+"_"+s)==="1")done++;

  }

 });

 document.getElementById("progressText").textContent=`${done} / ${total} подходов`;

 document.getElementById("progressBar").style.width=(total?done/total*100:0)+"%";

}

document.querySelectorAll(".tab").forEach(btn=>{

 btn.addEventListener("click",()=>{

  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");currentDay=btn.dataset.day;render();

 });

});

function showTime(){

 const m=Math.floor(remaining/60),s=remaining%60;

 document.getElementById("clock")=

  document.getElementById("clock");

 document.getElementById("clock").textContent=

  String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

}

function stopTimer(){if(interval){clearInterval(interval);interval=null}}

document.getElementById("duration").addEventListener("change",e=>{

 stopTimer();remaining=Number(e.target.value);showTime();

});

document.getElementById("start").addEventListener("click",()=>{

 if(interval)return;

 if(remaining<=0)remaining=Number(document.getElementById("duration").value);

 interval=setInterval(()=>{

  remaining--;showTime();

  if(remaining<=0){

   stopTimer();

   document.getElementById("clock").textContent="ГОТОВО";

   try{new AudioContext().resume()}catch(e){}

   if("Notification" in window && Notification.permission==="granted"){

    new Notification("SHOX WORKOUT",{body:"Время отдыха закончилось"});

   }

   if(navigator.vibrate)navigator.vibrate([300,150,300]);

   const audio=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");

   audio.play().catch(()=>{});

  }

 },1000);

});

document.getElementById("pause").addEventListener("click",stopTimer);

document.getElementById("reset").addEventListener("click",()=>{

 stopTimer();remaining=Number(document.getElementById("duration").value);showTime();

});

if("Notification" in window && Notification.permission==="default"){

 Notification.requestPermission().catch(()=>{});

}

render();showTime();

</script>

</body>

</html>
