<title>Тренировка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#111;color:#eee;font:17px -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);min-height:100vh;-webkit-user-select:none;user-select:none}
h1{font-size:28px;margin:8px 0 14px}
h2{font-size:14px;color:#888;font-weight:600;margin:22px 0 8px;text-transform:uppercase}
button{font:inherit;color:inherit;border:0;border-radius:14px;background:#262626;padding:14px;width:100%;touch-action:manipulation}
button:active{opacity:.6}
.primary{background:#2f80ed;color:#fff;font-weight:700;font-size:20px;padding:20px}
.day{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;text-align:left}
.day.next{outline:2px solid #2f80ed}
.muted{color:#888;font-size:14px}
.row{display:flex;gap:10px}
.row button{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top button{width:auto;padding:8px 14px;font-size:15px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:auto;min-width:40px;padding:8px 0;font-size:15px;border-radius:10px}
.dot.done{background:#1f6f43}
.dot.cur{outline:2px solid #2f80ed}
.card{background:#1c1c1c;border-radius:18px;padding:18px;margin-bottom:14px}
.ex{font-size:24px;font-weight:700;margin:6px 0 12px}
.set{font-size:40px;font-weight:800}
.tip{margin-top:10px;color:#bbb;font-size:15px}
.wu{margin-top:12px;padding:10px 12px;background:#2a2410;color:#f2c94c;border-radius:10px;font-size:15px}
.fail{margin-top:12px;padding:10px 12px;background:#3a1d17;color:#ff9b85;border-radius:10px;font-size:15px}
.fbk{margin-top:12px;padding:10px 12px;background:#14263a;color:#8cc4ff;border-radius:10px;font-size:15px}
.w{display:flex;align-items:center;gap:10px;margin-top:14px}
.w input{font:inherit;font-size:20px;width:110px;padding:10px;border-radius:10px;border:0;background:#2a2a2a;color:#fff;text-align:center}
.hint{margin-top:8px;color:#777;font-size:13px}
.anim{background:#161616;border-radius:14px;padding:8px 8px 10px;margin-bottom:12px;text-align:center}
.anim svg{width:100%;height:210px;display:block}
.ph{font-size:17px;font-weight:700;color:#f2c94c;min-height:22px;margin-top:2px}
.cues{font-size:13px;color:#999;margin-top:4px}
.small{display:inline-block;width:auto;margin-top:8px;padding:6px 12px;font-size:13px;border-radius:10px;background:#262626;color:#aaa}
.vid{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:#262626;color:#eee;text-decoration:none;font-size:16px}
#rest{position:fixed;inset:0;background:#111;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
#rest.on{display:flex}
#rest.over{animation:fl 1s infinite}
@keyframes fl{0%,100%{background:#1f6f43}50%{background:#2e9b5f}}
.clock{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0}
.hist{font-size:15px;color:#aaa;line-height:1.8}
</style>
</head>

const $=id=>document.getElementById(id);
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let S=ls.get('state',null);
const save=()=>ls.set('state',S);
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const dt=iso=>new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});

// звук: один сигнал
let ac;
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback';if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
document.addEventListener('touchend',unlock,{passive:true});
document.addEventListener('click',unlock);
function beep(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);const s=ac.currentTime;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.8,s+.02);g.gain.setValueAtTime(.8,s+.45);g.gain.exponentialRampToValueAtTime(.0001,s+.6);o.start(s);o.stop(s+.62)}

let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&S&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();tick()}});

// движок анимации
const F1=n=>n.toFixed(1);
const L=(a,b,c,w)=>`<line x1="${F1(a[0])}" y1="${F1(a[1])}" x2="${F1(b[0])}" y2="${F1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const C=(p,r,c)=>`<circle cx="${F1(p[0])}" cy="${F1(p[1])}" r="${r}" fill="${c}"/>`;
const nrm=v=>{const l=Math.hypot(v[0],v[1])||1;return[v[0]/l,v[1]/l]};
const ease=x=>x*x*(3-2*x);
const lerp=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
const MUSCLE='#ff7a59',BODY='#e8e8e8',GHOST='#2c2c2c',GEAR='#5aa9ff';
function prep(A){
  if(A._ok)return;A._ok=1;
  const g=(i,k)=>i?(A.f[1][k]||A.f[0][k]):A.f[0][k];
  const len=(i,a,b)=>Math.hypot(g(i,a)[0]-g(i,b)[0],g(i,a)[1]-g(i,b)[1]);
  A._ik=(A.ik||[]).map(([x,m,y])=>{
    let best=0;
    [0,1].forEach(i=>{const X=g(i,x),Y=g(i,y),M=g(i,m),c=(Y[0]-X[0])*(M[1]-X[1])-(Y[1]-X[1])*(M[0]-X[0]);if(Math.abs(c)>Math.abs(best))best=c});
    return[x,m,y,(len(0,x,m)+len(1,x,m))/2,(len(0,m,y)+len(1,m,y))/2,best>=0?1:-1];
  });
  A._hl=new Set(A.hl||[]);
  A._gh=figure(pose(A,0),A,true)+figure(pose(A,1),A,true);
}
function pose(A,f){
  const P0=A.f[0],P1=A.f[1],P={},g1=k=>P1[k]||P0[k];
  for(const k in P0)P[k]=lerp(P0[k],g1(k),f);
  (A.rot||[]).forEach(([c,par])=>{
    const v0=[P0[c][0]-P0[par][0],P0[c][1]-P0[par][1]],c1=g1(c),p1=g1(par),v1=[c1[0]-p1[0],c1[1]-p1[1]];
    const r0=Math.hypot(v0[0],v0[1]),r1=Math.hypot(v1[0],v1[1]),a0=Math.atan2(v0[1],v0[0]);
    let da=Math.atan2(v1[1],v1[0])-a0;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
    const r=r0+(r1-r0)*f,an=a0+da*f;P[c]=[P[par][0]+r*Math.cos(an),P[par][1]+r*Math.sin(an)];
  });
  (A._ik||[]).forEach(([x,m,y,L1,L2,sg])=>{
    const X=P[x],Y=P[y],dx=Y[0]-X[0],dy=Y[1]-X[1];let d=Math.hypot(dx,dy)||1;
    const ux=dx/d,uy=dy/d;d=Math.min(Math.max(d,Math.abs(L1-L2)+0.1),L1+L2-0.1);
    const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
    P[m]=[X[0]+ux*a-uy*h*sg,X[1]+uy*a+ux*h*sg];
  });
  return P;
}
function figure(P,A,ghost){
  let s='';
  A.seg.forEach(g=>{s+=L(P[g[0]],P[g[1]],ghost?GHOST:(A._hl.has(g[0]+'-'+g[1])?MUSCLE:BODY),g[2])});
  s+=C(P.h,13,ghost?GHOST:BODY);
  if(!ghost)(A.hj||[]).forEach(j=>{s+=C(P[j],7,MUSCLE)});
  return s;
}
function frame(A,f){
  prep(A);
  const P=pose(A,f);
  let s='<line x1="80" y1="266" x2="300" y2="266" stroke="#444" stroke-width="2"/>'+A._gh+(A.st||'');
  A.items.forEach(it=>{
    if(it.t==='cable')s+=L(it.from,P[it.p],'#888',2);
    if(it.t==='plat'){const a=P[it.a],t=P[it.p],k=P[it.k],u=nrm([t[0]-a[0],t[1]-a[1]]),d=nrm([a[0]-k[0],a[1]-k[1]]);
      s+=L([a[0]-u[0]*14+d[0]*8,a[1]-u[1]*14+d[1]*8],[t[0]+u[0]*22+d[0]*8,t[1]+u[1]*22+d[1]*8],GEAR,7)}
  });
  s+=figure(P,A,false);
  A.items.forEach(it=>{
    if(it.t==='bar')s+=C(P[it.p],8,GEAR);
    if(it.t==='db')s+=C(P[it.p],9,GEAR);
    if(it.t==='roll')s+=C(P[it.p],9,'#777');
    if(it.t==='cable')s+=C(P[it.p],5,GEAR);
  });
  return s;
}
let animT0=performance.now(),animKey='';
function animLoop(now){
  requestAnimationFrame(animLoop);
  const g=$('animg');if(!g||!S)return;
  const A=ANIM[PLAN[S.day].ex[S.i].n];if(!A)return;
  const P=A.ph,tot=P.reduce((a,x)=>a+x[0],0);
  let t=((now-animT0)/1000)%tot,f,txt;
  if(t<P[0][0]){f=ease(t/P[0][0]);txt=P[0][1]}
  else if((t-=P[0][0])<P[1][0]){f=1;txt=P[1][1]}
  else if((t-=P[1][0])<P[2][0]){f=1-ease(t/P[2][0]);txt=P[2][1]}
  else{f=0;txt=P[3][1]}
  g.innerHTML=frame(A,f);
  const tx=$('animtxt');if(tx&&tx.textContent!==txt)tx.textContent=txt;
}
requestAnimationFrame(animLoop);
function toggleAnim(){ls.set('hideAnim',!ls.get('hideAnim',false));render()}

const FB={1:'В прошлый раз было легко — добавь 5–10% веса',2:'В прошлый раз нормально — сделал все повторы? Добавь минимальный шаг веса',3:'В прошлый раз было тяжело — оставь этот вес'};

function nextDay(){const h=ls.get('hist',[]);return h.length?{A:'B',B:'C',C:'A'}[h[h.length-1].day]:'A'}

function home(){
  const h=ls.get('hist',[]),nd=nextDay();
  const last=d=>{for(let i=h.length-1;i>=0;i--)if(h[i].day===d)return h[i].date;return null};
  let html='<h1>Тренировка</h1>';
  if(S)html+=`<button class="primary" onclick="openW()">Продолжить: ${PLAN[S.day].name}</button><h2>Или начать заново</h2>`;
  else html+=`<p class="muted" style="margin-bottom:12px">Следующая по очереди: <b style="color:#eee">${PLAN[nd].name}</b></p>`;
  for(const d of ['A','B','C']){
    const l=last(d),P=PLAN[d];
    html+=`<button class="day ${!S&&d===nd?'next':''}" onclick="start('${d}')"><span><b>${P.name}</b><br><span class="muted">${P.ex.length} упр. · ${P.ex.reduce((a,e)=>a+e.s,0)} подх.</span></span><span class="muted">${l?dt(l):'ещё не было'}</span></button>`;
  }
  if(h.length)html+='<h2>История</h2><div class="hist">'+h.slice(-10).reverse().map(x=>`${dt(x.date)} — ${PLAN[x.day].name}, ${x.min} мин${x.done<x.total?` (${x.done}/${x.total} подх.)`:''}`).join('<br>')+'</div>';
  $('app').innerHTML=html;
}

function start(d){
  if(S&&!confirm('Текущая тренировка не завершена. Начать новую?'))return;
  S={day:d,i:0,done:PLAN[d].ex.map(()=>0),t0:Date.now(),restEnd:null,beeped:false,label:'',rate:null};
  save();openW();
}
function openW(){
  const P=PLAN[S.day];
  if(S.done.length!==P.ex.length)S.done=P.ex.map((e,k)=>Math.min(S.done[k]||0,e.s));
  if(S.i>=P.ex.length)S.i=0;
  keepAwake();render();tick();
}

function render(){
  const P=PLAN[S.day],e=P.ex[S.i],dn=S.done[S.i],w=ls.get('w:'+e.n,''),A=ANIM[e.n],fb=ls.get('fb:'+e.n,null);
  const key=S.day+S.i;if(key!==animKey){animKey=key;animT0=performance.now()}
  let html=`<div class="top"><button onclick="home()">‹ Меню</button><span class="muted" id="el"></span><button onclick="finish(false)">Завершить</button></div>`;
  html+='<div class="dots">'+P.ex.map((x,k)=>`<button class="dot ${S.done[k]>=x.s?'done':''} ${k===S.i?'cur':''}" onclick="go(${k})">${k+1}</button>`).join('')+'</div>';
  html+=`<div class="card"><div class="muted">${P.name} · упражнение ${S.i+1} из ${P.ex.length}</div><div class="ex">${e.n}</div>`;
  if(A){
    if(ls.get('hideAnim',false))html+='<button class="small" style="margin:0 0 12px" onclick="toggleAnim()">Показать технику</button>';
    else html+=`<div class="anim"><svg id="animg" viewBox="80 18 220 252"></svg><div class="ph" id="animtxt"></div><div class="cues">${A.cues}</div><div class="cues" style="color:#666">оранжевый — рабочие мышцы · тени — крайние точки</div><button class="small" onclick="toggleAnim()">Скрыть</button></div>`;
  }
  html+=dn>=e.s?'<div class="set" style="color:#4caf50">Готово ✓</div>':`<div class="set">Подход ${dn+1} из ${e.s}</div>`;
  html+=`<div style="margin-top:6px;font-size:19px">Повторов: <b>${e.r}</b> · запас <b>${e.rir}</b> · отдых ${fmt(e.rest)}</div>`;
  if(e.wu&&dn===0)html+=`<div class="wu">Разминка: ${e.wu}</div>`;
  if(dn===e.s-1)html+=e.f?'<div class="fail">Последний подход: до отказа + 3–5 частичных повторов в растянутой части</div>':'<div class="fail">Последний подход: остановись за 1–2 повтора до отказа, не раньше</div>';
  if(fb&&dn===0)html+=`<div class="fbk">${FB[fb]}</div>`;
  html+=`<div class="tip">${e.t}</div>`;
  html+=`<a class="vid" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.n+' техника')}" target="_blank" rel="noopener">▶ Видео техники</a>`;
  html+=`<div class="w"><span class="muted">Рабочий вес, кг</span><input type="number" inputmode="decimal" value="${w}" onchange="saveW(this.value)"></div>`;
  html+='<div class="hint">Все подходы — с одним весом. Сделал все повторы с запасом — в следующий раз добавь вес.</div></div>';
  html+=dn>=e.s?'<button class="primary" onclick="nextEx()">Следующее упражнение</button>':'<button class="primary" onclick="setDone()">Подход выполнен ✓</button>';
  html+='<div class="row" style="margin-top:10px"><button onclick="go(S.i-1)">‹ Назад</button><button onclick="go(S.i+1)">Вперёд ›</button></div>';
  $('app').innerHTML=html;tick();
}
function saveW(v){ls.set('w:'+PLAN[S.day].ex[S.i].n,v)}
function go(k){if(k<0||k>=PLAN[S.day].ex.length)return;S.i=k;save();render()}
function nextIdx(){const P=PLAN[S.day],n=P.ex.length;for(let k=1;k<=n;k++){const j=(S.i+k)%n;if(S.done[j]<P.ex[j].s)return j}return -1}
function nextEx(){const n=nextIdx();n<0?finish(true):go(n)}

function setDone(){
  const P=PLAN[S.day],e=P.ex[S.i];
  S.done[S.i]++;
  if(nextIdx()<0&&S.done[S.i]>=e.s){save();finish(true);return}
  let label;
  if(S.done[S.i]>=e.s){S.rate=e.n;const n=nextIdx();S.i=n;label=`Дальше: ${P.ex[n].n}, подход ${S.done[n]+1}`}
  else label=`Дальше: подход ${S.done[S.i]+1} из ${e.s}`;
  S.restEnd=Date.now()+e.rest*1000;S.beeped=false;S.label=label;restMode=null;
  save();render();
}
function rate(v){if(S.rate)ls.set('fb:'+S.rate,v);S.rate=null;save();restMode=null;tick()}

let restMode=null;
function tick(){
  if(!S)return;
  const el=$('el');if(el)el.textContent=fmt((Date.now()-S.t0)/1000);
  const r=$('rest');
  if(!S.restEnd){r.className='';restMode=null;return}
  const rem=(S.restEnd-Date.now())/1000,over=rem<=0;
  if(over&&!S.beeped){S.beeped=true;save();if(rem>-60)beep()}
  const mode=(over?'over':'run')+(S.rate?'r':'');
  if(mode!==restMode){
    restMode=mode;r.className='on'+(over?' over':'');
    let h=`<div style="font-size:22px;color:#ddd">${over?'Отдых окончен — пора!':'Отдых'}</div><div class="clock" id="rC"></div><div style="font-size:19px;margin-bottom:24px">${S.label}</div>`;
    if(S.rate)h+=`<div style="width:100%;margin-bottom:22px"><div style="color:#bbb;font-size:15px;margin-bottom:8px">Как прошло «${S.rate}»?</div><div class="row"><button onclick="rate(1)">Легко</button><button onclick="rate(2)">Норм</button><button onclick="rate(3)">Тяжело</button></div></div>`;
    h+=over?'<button class="primary" onclick="endRest()">Погнали</button>':'<div class="row" style="width:100%"><button onclick="adj(-15)">−15 с</button><button onclick="adj(15)">+15 с</button></div><button style="margin-top:10px" onclick="endRest()">Пропустить</button>';
    r.innerHTML=h;
  }
  $('rC').textContent=over?'+'+fmt(-rem):fmt(rem);
}
function adj(d){S.restEnd=Math.max(Date.now(),S.restEnd+d*1000);save();restMode=null;tick()}
function endRest(){S.restEnd=null;S.rate=null;save();tick();render()}
setInterval(tick,250);

function finish(auto){
  if(!auto&&!confirm('Завершить тренировку?'))return;
  const P=PLAN[S.day],total=P.ex.reduce((a,e)=>a+e.s,0),done=S.done.reduce((a,x)=>a+x,0),min=Math.round((Date.now()-S.t0)/60000);
  if(done>0){const h=ls.get('hist',[]);h.push({day:S.day,date:new Date().toISOString(),min,done,total});ls.set('hist',h.slice(-100))}
  S=null;save();
  if(wl){wl.release();wl=null}
  $('rest').className='';restMode=null;
  $('app').innerHTML=`<h1>Готово!</h1><div class="card"><div class="ex">${P.name}</div><div>Подходов: ${done} из ${total}</div><div>Время: ${min} мин</div></div><button class="primary" onclick="home()">В меню</button>`;
}

S?openW():home();
</script>
