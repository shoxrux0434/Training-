<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>3D-тест</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font:16px -apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 14px;background:linear-gradient(#111 65%,transparent);display:flex;gap:10px;align-items:flex-start}
#top a{color:#eee;text-decoration:none;background:#262626;border-radius:10px;padding:7px 12px;font-size:14px;flex:none}
h1{font-size:19px;margin:0}
.g{font-size:13px;color:#7fd1b9;margin-top:2px}
.hint{font-size:12px;color:#777;margin-top:2px}
#ui{position:fixed;left:0;right:0;bottom:0;padding:16px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,#111 35%)}
#ph{font-size:19px;font-weight:700;color:#f2c94c;min-height:26px;text-align:center;margin-bottom:6px}
#cues{font-size:13px;color:#999;text-align:center;margin-bottom:10px}
.row{display:flex;gap:8px}
button{flex:1;font:inherit;font-size:15px;color:#eee;background:#262626;border:0;border-radius:12px;padding:12px 4px;touch-action:manipulation}
button.on{background:#2f80ed}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#aaa;background:#111}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><a href="./">‹ Назад</a><div><h1>Болгарские выпады с гантелями</h1><div class="g">Для: квадрицепсы и ягодицы</div><div class="hint">Крути пальцем · двумя пальцами — масштаб</div></div></div>
<div id="ui">
  <div id="ph"></div>
  <div id="cues">Оранжевый — рабочие мышцы · корпус чуть вперёд · колено по линии стопы</div>
  <div class="row"><button data-v="side">Сбоку</button><button data-v="front">Спереди</button><button data-v="q" class="on">3/4</button><button id="pp">Пауза</button></div>
</div>
<div id="err">Не удалось загрузить 3D.<br>Для первого открытия нужен интернет.</div>
<script>setTimeout(()=>{if(!window.__ok)document.getElementById('err').style.display='flex'},10000)</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// Позы (те же, что в 2D): f0 — верх, f1 — низ
const F0={a:[214,258],t:[234,262],k:[200,205],p:[180,150],s:[186,90],h:[189,69],e:[186,120],w:[186,150],kb:[160,196],ab:[118,214],tb:[100,212]};
const F1={k:[226,212],p:[176,200],s:[182,140],h:[185,119],e:[182,170],w:[182,200],kb:[164,246]};
const IKS=[['a','k','p'],['p','kb','ab']];
const PH=[[1.4,'Медленно вниз'],[0.4,'Заднее колено почти у пола'],[0.9,'Вверх через пятку передней'],[0.5,'']];

const g2=(i,k)=>i?(F1[k]||F0[k]):F0[k];
const len=(i,a,b)=>Math.hypot(g2(i,a)[0]-g2(i,b)[0],g2(i,a)[1]-g2(i,b)[1]);
const ik=IKS.map(([x,m,y])=>{let best=0;[0,1].forEach(i=>{const X=g2(i,x),Y=g2(i,y),M=g2(i,m),c=(Y[0]-X[0])*(M[1]-X[1])-(Y[1]-X[1])*(M[0]-X[0]);if(Math.abs(c)>Math.abs(best))best=c});return[x,m,y,(len(0,x,m)+len(1,x,m))/2,(len(0,m,y)+len(1,m,y))/2,best>=0?1:-1]});
function pose2(f){
  const P={};
  for(const k in F0){const a=F0[k],b=F1[k]||a;P[k]=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
  ik.forEach(([x,m,y,L1,L2,sg])=>{const X=P[x],Y=P[y],dx=Y[0]-X[0],dy=Y[1]-X[1];let d=Math.hypot(dx,dy)||1;const ux=dx/d,uy=dy/d;d=Math.min(Math.max(d,Math.abs(L1-L2)+0.1),L1+L2-0.1);const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));P[m]=[X[0]+ux*a-uy*h*sg,X[1]+uy*a+ux*h*sg]});
  return P;
}

// Сцена
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111111);
const cam=new THREE.PerspectiveCamera(38,1,0.05,50);
const ctl=new OrbitControls(cam,cv);
ctl.target.set(0,0.95,-0.1);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=2;ctl.maxDistance=7;ctl.maxPolarAngle=Math.PI*0.5;
scene.add(new THREE.HemisphereLight(0xffffff,0x303040,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.7);sun.position.set(2.5,4,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-2,right:2,top:3,bottom:-1});scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x1c1c1c,roughness:1}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(6,24,0x2c2c2c,0x232323);grid.position.y=0.002;scene.add(grid);

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:0.55,metalness:0.05});
const BODY=M(0xe6e6e6),MUS=M(0xff7a59),GEAR=M(0x5aa9ff),BENCH=M(0x4a4a4a);
const UP=new THREE.Vector3(0,1,0);
function seg(r,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,18),mat);m.castShadow=true;scene.add(m);return m}
function ball(r,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat);m.castShadow=true;scene.add(m);return m}
function setSeg(m,A,B){const d=B.clone().sub(A),l=d.length();m.position.copy(A).addScaledVector(d,0.5);m.scale.set(1,l,1);m.quaternion.setFromUnitVectors(UP,d.normalize())}

// Скамья под задней ногой
const SC=0.0085;
const bench=new THREE.Group();
const top=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.06,0.42),BENCH);top.position.y=0.36;top.castShadow=true;top.receiveShadow=true;bench.add(top);
[[-0.13],[0.13]].forEach(([z])=>{const leg=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.33,0.04),BENCH);leg.position.set(0,0.165,z);leg.castShadow=true;bench.add(leg)});
bench.position.set(-0.1,0,(118-180)*SC-0.08);scene.add(bench);

// Манекен
const parts={
  torso:seg(0.12,BODY),neck:seg(0.045,BODY),pelvis:seg(0.075,BODY),shoulders:seg(0.06,BODY),
  thL:seg(0.068,MUS),shinL:seg(0.05,BODY),footL:seg(0.035,BODY),
  thR:seg(0.068,BODY),shinR:seg(0.05,BODY),footR:seg(0.035,BODY),
  uaL:seg(0.045,BODY),faL:seg(0.038,BODY),uaR:seg(0.045,BODY),faR:seg(0.038,BODY)
};
const J={
  head:ball(0.11,BODY),chest:ball(0.12,BODY),hipC:ball(0.12,BODY),
  hipL:ball(0.085,MUS),hipR:ball(0.08,BODY),kneeL:ball(0.06,BODY),kneeR:ball(0.06,BODY),ankL:ball(0.045,BODY),ankR:ball(0.045,BODY),
  shL:ball(0.065,BODY),shR:ball(0.065,BODY),elL:ball(0.045,BODY),elR:ball(0.045,BODY),wrL:ball(0.038,BODY),wrR:ball(0.038,BODY)
};
function dumbbell(){const g=new THREE.Group();const h=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.16,10),GEAR);h.rotation.z=Math.PI/2;g.add(h);
  [-0.09,0.09].forEach(x=>{const d=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.045,18),GEAR);d.rotation.z=Math.PI/2;d.position.x=x;d.castShadow=true;g.add(d)});scene.add(g);return g}
const dbL=dumbbell(),dbR=dumbbell();

const V=(p,x)=>new THREE.Vector3(x,(266-p[1])*SC,(p[0]-180)*SC);
function update(f){
  const P=pose2(f);
  const q={
    hipC:V(P.p,0),hipL:V(P.p,0.1),hipR:V(P.p,-0.1),
    kneeL:V(P.k,0.1),ankL:V(P.a,0.1),toeL:V(P.t,0.1),
    kneeR:V(P.kb,-0.1),ankR:V(P.ab,-0.1),toeR:V(P.tb,-0.1),
    chest:V(P.s,0).add(new THREE.Vector3(0,-0.06,0)),shL:V(P.s,0.19),shR:V(P.s,-0.19),
    elL:V(P.e,0.22),wrL:V(P.w,0.22),elR:V(P.e,-0.22),wrR:V(P.w,-0.22),
    head:V(P.h,0).add(new THREE.Vector3(0,0.03,0))
  };
  setSeg(parts.torso,q.hipC,q.chest);setSeg(parts.neck,q.chest,q.head);
  setSeg(parts.pelvis,q.hipR,q.hipL);setSeg(parts.shoulders,q.shR,q.shL);
  setSeg(parts.thL,q.hipL,q.kneeL);setSeg(parts.shinL,q.kneeL,q.ankL);setSeg(parts.footL,q.ankL,q.toeL);
  setSeg(parts.thR,q.hipR,q.kneeR);setSeg(parts.shinR,q.kneeR,q.ankR);setSeg(parts.footR,q.ankR,q.toeR);
  setSeg(parts.uaL,q.shL,q.elL);setSeg(parts.faL,q.elL,q.wrL);setSeg(parts.uaR,q.shR,q.elR);setSeg(parts.faR,q.elR,q.wrR);
  for(const k in J)J[k].position.copy(q[k]);
  dbL.position.copy(q.wrL).add(new THREE.Vector3(0.02,-0.03,0));dbR.position.copy(q.wrR).add(new THREE.Vector3(-0.02,-0.03,0));
}

// Камера и кнопки
const VIEWS={side:[3.8,1.1,-0.1],front:[0,1.2,3.6],q:[2.7,1.7,2.4]};
function setView(v){cam.position.set(...VIEWS[v]);ctl.update();document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
let paused=false;document.getElementById('pp').onclick=e=>{paused=!paused;e.target.textContent=paused?'Пуск':'Пауза'};
setView('q');
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const ease=x=>x*x*(3-2*x),tot=PH.reduce((a,x)=>a+x[0],0),phEl=document.getElementById('ph');
let t=0,last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,0.1);last=now;if(!paused)t+=dt;
  let x=t%tot,f,txt;
  if(x<PH[0][0]){f=ease(x/PH[0][0]);txt=PH[0][1]}
  else if((x-=PH[0][0])<PH[1][0]){f=1;txt=PH[1][1]}
  else if((x-=PH[1][0])<PH[2][0]){f=1-ease(x/PH[2][0]);txt=PH[2][1]}
  else{f=0;txt=PH[3][1]}
  if(phEl.textContent!==txt)phEl.textContent=txt;
  update(f);ctl.update();R.render(scene,cam);
}
window.__ok=true;
requestAnimationFrame(loop);
</script>
</body>
</html>
