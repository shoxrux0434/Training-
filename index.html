<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировка">
<meta name="theme-color" content="#111111">
<title>Тренировка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#111;color:#eee;font:17px -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);min-height:100vh;-webkit-user-select:none;user-select:none}
body.wmode{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 10px)}
body.wmode #app{height:100%}
h1{font-size:28px;margin:8px 0 14px}
h2{font-size:14px;color:#888;font-weight:600;margin:22px 0 8px;text-transform:uppercase}
button{font:inherit;color:inherit;border:0;border-radius:14px;background:#262626;padding:14px;width:100%;touch-action:manipulation}
button:active,.tb:active{opacity:.6}
.primary{background:#2f80ed;color:#fff;font-weight:700;font-size:20px;padding:20px}
.day{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;text-align:left;gap:10px}
.day.next{outline:2px solid #2f80ed}
.day.on{outline:2px solid #f2c94c}
.muted{color:#888;font-size:14px}
.row{display:flex;gap:10px}
.row button{flex:1}
.card{background:#1c1c1c;border-radius:18px;padding:18px;margin-bottom:14px}
.ex{font-size:24px;font-weight:700;margin:6px 0 12px}
.hist{font-size:15px;color:#aaa;line-height:1.8}
.wk{display:flex;flex-direction:column;height:100%;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center}
.top button{width:auto;padding:7px 12px;font-size:14px;border-radius:10px}
.dots{display:flex;gap:5px;flex-wrap:nowrap}
.dot{width:auto;min-width:0;flex:1;padding:6px 0;font-size:14px;border-radius:9px}
.dot.done{background:#1f6f43}
.dot.cur{outline:2px solid #2f80ed}
.title{font-size:21px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goal{font-size:13px;color:#7fd1b9;margin-top:2px}
.anim{flex:1;min-height:0;display:flex;flex-direction:column;background:#161616;border-radius:14px;padding:6px 8px 8px;text-align:center}
.anim svg{flex:1;min-height:0;width:100%;display:block}
.ph{font-size:16px;font-weight:700;color:#f2c94c;min-height:20px}
.cues{font-size:12px;color:#999;margin-top:2px}
.tipline{font-size:12px;color:#777;margin-top:2px}
.tipbig{flex:1;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ccc;padding:10px;line-height:1.4}
.info{display:flex;justify-content:space-between;align-items:center;background:#1c1c1c;border-radius:14px;padding:8px 14px;gap:10px}
.set{font-size:30px;font-weight:800}
.uni{font-size:12px;color:#f2c94c;margin-top:2px;line-height:1.3}
.meta{text-align:right;display:flex;flex-direction:column;flex:none}
.meta b{font-size:19px}
.meta span{font-size:13px;color:#999}
.note{padding:8px 12px;border-radius:10px;font-size:14px;line-height:1.3}
.wu{background:#2a2410;color:#f2c94c}
.fail{background:#3a1d17;color:#ff9b85}
.fbk{background:#14263a;color:#8cc4ff}
.tools{display:flex;gap:8px;align-items:center}
.wt{display:flex;align-items:center;gap:4px;background:#262626;border-radius:12px;padding:0 10px;height:44px;flex:1;min-width:0}
.wt input{font:inherit;font-size:18px;width:100%;min-width:0;border:0;background:transparent;color:#fff;text-align:center;height:44px;outline:none}
.wt span{color:#888;font-size:14px}
.tb{display:flex;align-items:center;justify-content:center;height:44px;padding:0 12px;border-radius:12px;background:#262626;color:#eee;text-decoration:none;font-size:15px;width:auto;flex:none}
.act{display:flex;gap:8px}
.act .nav{width:54px;flex:none;font-size:26px;padding:0}
.act .primary{flex:1;padding:18px 8px}
#rest{position:fixed;inset:0;background:#111;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
#rest.on{display:flex}
#rest.over{animation:fl 1s infinite}
@keyframes fl{0%,100%{background:#1f6f43}50%{background:#2e9b5f}}
.clock{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0}
</style>
</head>

let ac;

function beep(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);const s=ac.currentTime;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.8,s+.02);g.gain.setValueAtTime(.8,s+.45);g.gain.exponentialRampToValueAtTime(.0001,s+.6);o.start(s);o.stop(s+.62)}

// движок анимации
const F1=n=>n.toFixed(1);
const L=(a,b,c,w)=>`<line x1="${F1(a[0])}" y1="${F1(a[1])}" x2="${F1(b[0])}" y2="${F1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const C=(p,r,c)=>`<circle cx="${F1(p[0])}" cy="${F1(p[1])}" r="${r}" fill="${c}"/>`;
const nrm=v=>{const l=Math.hypot(v[0],v[1])||1;return[v[0]/l,v[1]/l]};
const ease=x=>x*x*(3-2*x);
const lerp=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
const MUSCLE='#ff7a59',BODY='#e8e8e8',GHOST='#2c2c2c',GEAR='#5aa9ff';
function prep(A){
  if(A._ok)return;A._ok=1;
  const g=(i,k)=>i?(A.f[1][k]||A.f[0][k]):A.f[0][k];
  const len=(i,a,b)=>Math.hypot(g(i,a)[0]-g(i,b)[0],g(i,a)[1]-g(i,b)[1]);
  A._ik=(A.ik||[]).map(([x,m,y])=>{
    let best=0;
    [0,1].forEach(i=>{const X=g(i,x),Y=g(i,y),M=g(i,m),c=(Y[0]-X[0])*(M[1]-X[1])-(Y[1]-X[1])*(M[0]-X[0]);if(Math.abs(c)>Math.abs(best))best=c});
    return[x,m,y,(len(0,x,m)+len(1,x,m))/2,(len(0,m,y)+len(1,m,y))/2,best>=0?1:-1];
  });
  A._hl=new Set(A.hl||[]);
  A._gh=figure(pose(A,0),A,true)+figure(pose(A,1),A,true);
}
function pose(A,f){
  const P0=A.f[0],P1=A.f[1],P={},g1=k=>P1[k]||P0[k];
  for(const k in P0)P[k]=lerp(P0[k],g1(k),f);
  (A.rot||[]).forEach(([c,par])=>{
    const v0=[P0[c][0]-P0[par][0],P0[c][1]-P0[par][1]],c1=g1(c),p1=g1(par),v1=[c1[0]-p1[0],c1[1]-p1[1]];
    const r0=Math.hypot(v0[0],v0[1]),r1=Math.hypot(v1[0],v1[1]),a0=Math.atan2(v0[1],v0[0]);
    let da=Math.atan2(v1[1],v1[0])-a0;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
    const r=r0+(r1-r0)*f,an=a0+da*f;P[c]=[P[par][0]+r*Math.cos(an),P[par][1]+r*Math.sin(an)];
  });
  (A._ik||[]).forEach(([x,m,y,L1,L2,sg])=>{
    const X=P[x],Y=P[y],dx=Y[0]-X[0],dy=Y[1]-X[1];let d=Math.hypot(dx,dy)||1;
    const ux=dx/d,uy=dy/d;d=Math.min(Math.max(d,Math.abs(L1-L2)+0.1),L1+L2-0.1);
    const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
    P[m]=[X[0]+ux*a-uy*h*sg,X[1]+uy*a+ux*h*sg];
  });
  return P;
}
function figure(P,A,ghost){
  let s='';
  A.seg.forEach(g=>{s+=L(P[g[0]],P[g[1]],ghost?GHOST:(A._hl.has(g[0]+'-'+g[1])?MUSCLE:BODY),g[2])});
  s+=C(P.h,13,ghost?GHOST:BODY);
  if(!ghost)(A.hj||[]).forEach(j=>{s+=C(P[j],7,MUSCLE)});
  return s;
}
function frame(A,f){
  prep(A);
  const P=pose(A,f);
  let s='<line x1="80" y1="266" x2="300" y2="266" stroke="#444" stroke-width="2"/>'+A._gh+(A.st||'');
  A.items.forEach(it=>{
    if(it.t==='cable')s+=L(it.from,P[it.p],'#888',2);
    if(it.t==='plat'){const a=P[it.a],t=P[it.p],k=P[it.k],u=nrm([t[0]-a[0],t[1]-a[1]]),d=nrm([a[0]-k[0],a[1]-k[1]]);
      s+=L([a[0]-u[0]*14+d[0]*8,a[1]-u[1]*14+d[1]*8],[t[0]+u[0]*22+d[0]*8,t[1]+u[1]*22+d[1]*8],GEAR,7)}
  });
  s+=figure(P,A,false);
  A.items.forEach(it=>{
    if(it.t==='bar')s+=C(P[it.p],8,GEAR);
    if(it.t==='db')s+=C(P[it.p],9,GEAR);
    if(it.t==='roll')s+=C(P[it.p],9,'#777');
    if(it.t==='cable')s+=C(P[it.p],5,GEAR);
  });
  return s;
}
let animT0=performance.now(),animKey='';
function animLoop(now){
  requestAnimationFrame(animLoop);
  const g=$('animg');if(!g||!S)return;
  const A=ANIM[PLAN[S.day].ex[S.i].n];if(!A)return;
  const P=A.ph,tot=P.reduce((a,x)=>a+x[0],0);
  let t=((now-animT0)/1000)%tot,f,txt;
  if(t<P[0][0]){f=ease(t/P[0][0]);txt=P[0][1]}
  else if((t-=P[0][0])<P[1][0]){f=1;txt=P[1][1]}
  else if((t-=P[1][0])<P[2][0]){f=1-ease(t/P[2][0]);txt=P[2][1]}
  else{f=0;txt=P[3][1]}
  g.innerHTML=frame(A,f);
  const tx=$('animtxt');if(tx&&tx.textContent!==txt)tx.textContent=txt;
}
requestAnimationFrame(animLoop);
function toggleAnim(){ls.set('hideAnim',!ls.get('hideAnim',false));render()}

const FB={1:'В прошлый раз было легко — добавь 5–10% веса',2:'В прошлый раз нормально — сделал все повторы? Добавь минимальный шаг веса',3:'В прошлый раз было тяжело — оставь этот вес'};

function nextDay(){const h=ls.get('hist',[]);return h.length?{A:'B',B:'C',C:'A'}[h[h.length-1].day]:'A'}
function toggleDL(){const v=!DL();ls.set('deload',v);ls.set('dlc',0);if(!v)ls.set('dlAt',ls.get('hist',[]).length);home()}

function home(){
  document.body.classList.remove('wmode');
  const h=ls.get('hist',[]),nd=nextDay(),since=h.length-ls.get('dlAt',0);
  const last=d=>{for(let i=h.length-1;i>=0;i--)if(h[i].day===d)return h[i].date;return null};
  let html='<h1>Тренировка</h1>';
  if(!DL()&&since>=18)html+=`<div class="note fbk" style="margin-bottom:12px">Уже ${since} тренировок без разгрузки — пора на неделю разгрузки</div>`;
  if(S)html+=`<button class="primary" onclick="openW()">Продолжить: ${PLAN[S.day].name}</button><h2>Или начать заново</h2>`;
  else html+=`<p class="muted" style="margin-bottom:12px">Следующая по очереди: <b style="color:#eee">${PLAN[nd].name}</b></p>`;
  for(const d of ['A','B','C']){
    const l=last(d),P=PLAN[d];
    html+=`<button class="day ${!S&&d===nd?'next':''}" onclick="start('${d}')"><span><b>${P.name}</b><br><span class="muted">${P.ex.length} упр. · ${P.ex.reduce((a,e)=>a+SETS(e),0)} подх.</span></span><span class="muted">${l?dt(l):'ещё не было'}</span></button>`;
  }
  html+=`<button class="day ${DL()?'on':''}" onclick="toggleDL()"><span><b>Неделя разгрузки</b><br><span class="muted">${DL()?'Включена: подходов вдвое меньше, до отказа не доходи. Выключится сама через 3 тренировки':'Раз в 6–8 недель или когда накопилась усталость'}</span></span><span class="muted">${DL()?'вкл':'выкл'}</span></button>`;
  if(h.length)html+='<h2>История</h2><div class="hist">'+h.slice(-10).reverse().map(x=>`${dt(x.date)} — ${PLAN[x.day].name}, ${x.min} мин${x.done<x.total?` (${x.done}/${x.total} подх.)`:''}${x.dl?' · разгрузка':''}`).join('<br>')+'</div>';
  $('app').innerHTML=html;
}

function start(d){
  if(S&&!confirm('Текущая тренировка не завершена. Начать новую?'))return;
  S={day:d,i:0,done:PLAN[d].ex.map(()=>0),t0:Date.now(),restEnd:null,beeped:false,label:'',rq:[]};
  save();openW();
}
function openW(){
  const P=PLAN[S.day];
  if(S.done.length!==P.ex.length)S.done=P.ex.map((e,k)=>Math.min(S.done[k]||0,e.s));
  if(S.i>=P.ex.length)S.i=0;
  if(!S.rq)S.rq=[];
  keepAwake();render();tick();
}

function render(){
  document.body.classList.add('wmode');
  const P=PLAN[S.day],e=P.ex[S.i],dn=S.done[S.i],ns=SETS(e),w=ls.get('w:'+e.n,''),A=ANIM[e.n],fb=ls.get('fb:'+e.n,null),hid=ls.get('hideAnim',false);
  const prv=S.i>0&&P.ex[S.i-1].ss?P.ex[S.i-1]:null;
  const key=S.day+S.i;if(key!==animKey){animKey=key;animT0=performance.now()}
  let note='';
  if(dn===0&&e.wu)note=`<div class="note wu">Разминка: ${e.wu}</div>`;
  else if(DL())note='<div class="note fbk">Разгрузка: вес тот же, остановись за 3 повтора до отказа</div>';
  else if(dn<=1&&fb)note=`<div class="note fbk">${FB[fb]}</div>`;
  else if(dn===ns-1)note=`<div class="note fail">${e.f?'Последний подход: до отказа + 3–5 частичных повторов в растянутой части':'Последний подход: остановись за 1–2 повтора до отказа, не раньше'}${e.xl?'. Потом ещё 1 подход только левой':''}</div>`;
  const tags=[];
  if(e.u)tags.push('Сначала левая, правая — столько же');
  if(e.ss)tags.push('Суперсет → сразу '+P.ex[S.i+1].n.toLowerCase());
  if(prv)tags.push('Суперсет с: '+prv.n.toLowerCase());
  let h='<div class="wk">';
  h+=`<div class="top"><button onclick="home()">‹ Меню</button><span class="muted">${P.name}${DL()?' · разгрузка':''} · <span id="el"></span></span><button onclick="finish(false)">Завершить</button></div>`;
  h+='<div class="dots">'+P.ex.map((x,k)=>`<button class="dot ${S.done[k]>=SETS(x)?'done':''} ${k===S.i?'cur':''}" onclick="go(${k})">${k+1}</button>`).join('')+'</div>';
  h+=`<div><div class="title">${e.n}</div><div class="goal">Для: ${e.g}</div></div>`;
  if(A&&!hid)h+=`<div class="anim"><svg id="animg" viewBox="80 18 220 252" preserveAspectRatio="xMidYMid meet"></svg><div class="ph" id="animtxt"></div><div class="cues">${A.cues}</div><div class="tipline">${e.t}</div></div>`;
  else h+=`<div class="anim"><div class="tipbig">${e.t}</div>${A?`<div class="cues">${A.cues}</div>`:''}</div>`;
  h+=`<div class="info"><div><div class="set" ${dn>=ns?'style="color:#4caf50"':''}>${dn>=ns?'Готово ✓':`Подход ${dn+1}/${ns}`}</div>${tags.length?`<div class="uni">${tags.join('<br>')}</div>`:''}</div><div class="meta"><b>${e.r} повторов</b><span>запас ${DL()?'3':e.rir} · ${e.ss?'без отдыха':'отдых '+fmt(e.rest)}</span></div></div>`;
  h+=note;
  h+=`<div class="tools"><label class="wt"><input type="number" inputmode="decimal" placeholder="вес" value="${w}" onchange="saveW(this.value)"><span>кг</span></label><a class="tb" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.n+' техника')}" target="_blank" rel="noopener">▶ Видео</a>${A?`<button class="tb" onclick="toggleAnim()">${hid?'Анимация':'Скрыть'}</button>`:''}</div>`;
  h+=`<div class="act"><button class="nav" onclick="go(S.i-1)">‹</button>${dn>=ns?'<button class="primary" onclick="nextEx()">Следующее упражнение</button>':'<button class="primary" onclick="setDone()">Подход выполнен ✓</button>'}<button class="nav" onclick="go(S.i+1)">›</button></div>`;
  h+='</div>';
  $('app').innerHTML=h;tick();
}
function saveW(v){ls.set('w:'+PLAN[S.day].ex[S.i].n,v)}
function go(k){if(k<0||k>=PLAN[S.day].ex.length)return;S.i=k;save();render()}
function nextIdx(){const P=PLAN[S.day],n=P.ex.length;for(let k=1;k<=n;k++){const j=(S.i+k)%n;if(S.done[j]<SETS(P.ex[j]))return j}return -1}
function nextEx(){const n=nextIdx();n<0?finish(true):go(n)}

function setDone(){
  const P=PLAN[S.day],i=S.i,e=P.ex[i];
  S.done[i]++;
  if(S.done[i]>=SETS(e))S.rq.push(e.n);
  if(nextIdx()<0&&S.done[i]>=SETS(e)){save();finish(true);return}
  if(e.ss&&P.ex[i+1]&&S.done[i+1]<SETS(P.ex[i+1])){S.i=i+1;save();render();return}
  const pr=i>0&&P.ex[i-1].ss?i-1:-1;
  let label;
  if(pr>=0&&S.done[pr]<SETS(P.ex[pr])){S.i=pr;label=`Дальше: суперсет — ${P.ex[pr].n}, подход ${S.done[pr]+1}`}
  else if(S.done[i]>=SETS(e)){const n=nextIdx();S.i=n;label=`Дальше: ${P.ex[n].n}, подход ${S.done[n]+1}`}
  else label=`Дальше: подход ${S.done[i]+1} из ${SETS(e)}`;
  S.restEnd=Date.now()+e.rest*1000;S.beeped=false;S.label=label;restMode=null;
  save();render();
}
function rate(v){const n=S.rq.shift();if(n)ls.set('fb:'+n,v);save();restMode=null;tick()}

let restMode=null;
function tick(){
  if(!S)return;
  const el=$('el');if(el)el.textContent=fmt((Date.now()-S.t0)/1000);
  const r=$('rest');
  if(!S.restEnd){r.className='';restMode=null;return}
  const rem=(S.restEnd-Date.now())/1000,over=rem<=0;
  if(over&&!S.beeped){S.beeped=true;save();if(rem>-60)beep()}
  const mode=(over?'over':'run')+S.rq.length;
  if(mode!==restMode){
    restMode=mode;r.className='on'+(over?' over':'');
    let h=`<div style="font-size:22px;color:#ddd">${over?'Отдых окончен — пора!':'Отдых'}</div><div class="clock" id="rC"></div><div style="font-size:19px;margin-bottom:24px">${S.label}</div>`;
    if(S.rq.length)h+=`<div style="width:100%;margin-bottom:22px"><div style="color:#bbb;font-size:15px;margin-bottom:8px">Как прошло «${S.rq[0]}»?</div><div class="row"><button onclick="rate(1)">Легко</button><button onclick="rate(2)">Норм</button><button onclick="rate(3)">Тяжело</button></div></div>`;
    h+=over?'<button class="primary" onclick="endRest()">Погнали</button>':'<div class="row" style="width:100%"><button onclick="adj(-15)">−15 с</button><button onclick="adj(15)">+15 с</button></div><button style="margin-top:10px" onclick="endRest()">Пропустить</button>';
    r.innerHTML=h;
  }
  $('rC').textContent=over?'+'+fmt(-rem):fmt(rem);
}
function adj(d){S.restEnd=Math.max(Date.now(),S.restEnd+d*1000);save();restMode=null;tick()}
function endRest(){S.restEnd=null;S.rq=[];save();tick();render()}
setInterval(tick,250);

function finish(auto){
  if(!auto&&!confirm('Завершить тренировку?'))return;
  const P=PLAN[S.day],total=P.ex.reduce((a,e)=>a+SETS(e),0),done=S.done.reduce((a,x)=>a+x,0),min=Math.round((Date.now()-S.t0)/60000),wasDL=DL();
  if(done>0){
    const h=ls.get('hist',[]);h.push({day:S.day,date:new Date().toISOString(),min,done,total,dl:wasDL});ls.set('hist',h.slice(-100));
    if(wasDL){const c=ls.get('dlc',0)+1;if(c>=3){ls.set('deload',false);ls.set('dlc',0);ls.set('dlAt',Math.min(h.length,100))}else ls.set('dlc',c)}
  }
  S=null;save();
  if(wl){wl.release();wl=null}
  document.body.classList.remove('wmode');
  $('rest').className='';restMode=null;
  $('app').innerHTML=`<h1>Готово!</h1><div class="card"><div class="ex">${P.name}</div><div>Подходов: ${done} из ${total}</div><div>Время: ${min} мин</div>${wasDL&&!DL()?'<div style="margin-top:8px;color:#8cc4ff">Неделя разгрузки завершена — со следующей тренировки обычный режим</div>':''}</div><button class="primary" onclick="home()">В меню</button>`;
}

S?openW():home();
</script>
</body>
</html>
