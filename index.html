
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10130f">
<title>SHOX WORKOUT</title>
<style>
:root{
 --bg:#10130f;--panel:#1b2119;--panel2:#252e22;
 --lime:#c5f36b;--text:#f3f5ef;--muted:#a1aa99;
 --line:#35402f;--red:#ff7777;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;padding:18px}
header,main,.timer{max-width:950px;margin-left:auto;margin-right:auto}
.brand{color:var(--lime);font-size:12px;letter-spacing:4px;font-weight:bold}
h1{font-size:30px;margin:9px 0}
.subtitle,.small,.meta{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:8px;margin:22px 0}
button{border:0;border-radius:9px;padding:11px 14px;
 background:var(--lime);color:#18200f;font-weight:bold;cursor:pointer}
button.secondary,.tab{background:var(--panel2);color:var(--text)}
.tab{flex:1;border:1px solid var(--line)}
.tab.active{background:var(--lime);color:#18200f}
.summary,.exercise,.superset{
 background:var(--panel);border:1px solid var(--line);
 border-radius:14px;padding:15px;margin-bottom:12px
}
.progress{height:7px;background:#35402f;border-radius:9px;margin-top:12px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--lime)}
.exercise h3{font-size:16px;margin:0 0 7px}
.sets{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}
.set{background:var(--panel2);padding:8px;border-radius:8px;font-size:12px}
.set input{accent-color:var(--lime);width:16px;height:16px;vertical-align:middle}
.weight{display:flex;align-items:center;gap:8px}
.weight input{width:80px;background:#10130f;color:white;
 border:1px solid var(--line);padding:9px;border-radius:8px}
details{border-top:1px solid var(--line);margin-top:13px;padding-top:12px}
summary{color:var(--lime);cursor:pointer;font-weight:bold;font-size:13px}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}
.guide p,.guide li{font-size:12px;line-height:1.6;color:#c8cec1}
.guide h4{font-size:13px;margin:8px 0}
.video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;
 border-radius:12px;background:#080a08;margin:12px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.superset{border-color:#667c3c;background:#1c2519}
.superset-title{color:var(--lime);font-weight:bold;font-size:12px;margin-bottom:12px}
.timer{position:sticky;bottom:8px;background:#20291d;border:1px solid #53683c;
 border-radius:14px;padding:13px;display:flex;gap:10px;align-items:center;
 justify-content:space-between;flex-wrap:wrap;margin-top:22px;z-index:5}
.clock{font-size:28px;font-weight:bold;color:var(--lime);font-variant-numeric:tabular-nums}
select{background:#10130f;color:white;border:1px solid var(--line);padding:9px;border-radius:8px}
@media(max-width:600px){
 body{padding:12px}.guide{grid-template-columns:1fr}
 .tabs{gap:5px}.tab{font-size:11px;padding:11px 5px}
}
</style>
</head>
<body>
<header>
 <div class="brand">SHOX / TRAINING SYSTEM</div>
 <h1>SHOX WORKOUT</h1>
 <div class="subtitle">Твоя программа тренировок · Понедельник / Среда / Пятница</div>
</header>

<main>
 <div class="tabs">
  <button class="tab active" data-day="mon">ПОНЕДЕЛЬНИК</button>
  <button class="tab" data-day="wed">СРЕДА</button>
  <button class="tab" data-day="fri">ПЯТНИЦА</button>
 </div>
 <section class="summary">
  <div style="display:flex;justify-content:space-between;gap:8px">
   <b id="dayTitle">Понедельник</b>
   <span class="small" id="progressText">0 / 0 подходов</span>
  </div>
  <div class="progress"><span id="progressBar"></span></div>
 </section>
 <section id="workout"></section>
</main>

<div class="timer">
 <div>
  <div class="small">ТАЙМЕР ОТДЫХА</div>
  <div class="clock" id="clock">01:30</div>
 </div>
 <select id="duration">
  <option value="60">60 секунд</option>
  <option value="90" selected>90 секунд</option>
  <option value="120">120 секунд</option>
  <option value="150">150 секунд</option>
 </select>
 <div style="display:flex;gap:6px">
  <button id="start">Старт</button>
  <button class="secondary" id="pause">Пауза</button>
  <button class="secondary" id="reset">Сброс</button>
 </div>
</div>

<script>
const workouts={
 mon:{
  title:"Понедельник",
  items:[
   ["Гиперэкстензия",4,12,"Скамья для гиперэкстензии","Разгибатели спины, ягодицы"],
   ["Тяга верхнего блока нейтральным хватом",4,10,"Блочный тренажёр","Широчайшие, бицепс"],
   ["Жим плеч в тренажёре сидя",4,8,"Тренажёр для плеч","Передние и средние дельты, трицепс"],
   ["Жим гантелей лёжа",4,8,"Гантели + горизонтальная скамья","Грудные мышцы, трицепс"],
   ["Горизонтальная тяга блока к поясу",3,10,"Горизонтальный блочный тренажёр","Широчайшие, ромбовидные"],
   ["Сведение рук в тренажёре",3,12,"Pec Deck","Грудные мышцы"],
   ["Махи гантелями в стороны",4,15,"Гантели","Средние дельты"],
   ["Обратная бабочка",3,15,"Reverse Pec Deck","Задние дельты"],
   ["Подъём на носки",3,12,"Машина Смита, две ноги","Икроножные, камбаловидные"],
   ["Сгибание рук на наклонной скамье",3,10,"Гантели + наклонная скамья","Бицепс"],
   ["Разгибание рук на блоке",3,12,"Верхний блок","Трицепс"]
  ],
  supersets:[[9,10]]
 },
 wed:{
  title:"Среда",
  items:[
   ["Болгарские выпады",4,10,"Гантели + скамья","Квадрицепсы, ягодицы"],
   ["Жим гантелей на наклонной скамье 30°",4,10,"Гантели + наклонная скамья","Верх груди, трицепс"],
   ["Вертикальная тяга сидя",4,10,"Рычажный тренажёр с дисками","Широчайшие, ромбовидные"],
   ["Тяга прямыми руками",3,12,"Кроссовер","Широчайшие"],
   ["Сгибание ног сидя",4,12,"Тренажёр для ног","Бицепс бедра"],
   ["Махи гантелями в стороны сидя",4,15,"Гантели + скамья","Средние дельты"],
   ["Французский жим",3,12,"Гантель или EZ-гриф","Трицепс"],
   ["Молотковые сгибания",3,12,"Гантели","Бицепс, плечевая мышца"]
  ],
  supersets:[[6,7]]
 },
 fri:{
  title:"Пятница",
  items:[
   ["Жим ногами",4,8,"Тренажёр для жима ногами","Квадрицепсы, ягодицы"],
   ["Подъём на носки",3,12,"Машина Смита, две ноги","Икроножные, камбаловидные"],
   ["Жим гантелей сидя",4,10,"Гантели + скамья","Передние и средние дельты"],
   ["Тяга гантелей с упором грудью",4,10,"Наклонная скамья + гантели","Широчайшие, ромбовидные"],
   ["Жим от груди Hammer Strength",3,10,"Рычажный тренажёр","Грудные мышцы, трицепс"],
   ["Разгибание ног",3,12,"Тренажёр для разгибания ног","Квадрицепсы"],
   ["Сгибание ног сидя",4,12,"Тренажёр для сгибания ног","Бицепс бедра"],
   ["Махи гантелями в стороны",3,15,"Гантели","Средние дельты"],
   ["Сгибание рук в тренажёре",3,12,"Бицепс-машина","Бицепс"],
   ["Разгибание рук на блоке",3,12,"Верхний блок","Трицепс"]
  ],
  supersets:[[8,9]]
 }
};

const exerciseVideos={
 "Жим ногами":"cDGOn-yfKJA"
};

let currentDay="mon";
let remaining=90;
let interval=null;

function makeKey(day,index,set){
 return `shox_${day}_${index}_${set}`;
}

function makeExercise(item,index,tag){
 const [name,sets,reps,equipment,muscles]=item;
 const el=document.createElement("article");
 el.className="exercise";

 const video=exerciseVideos[name]
 ? `<div class="small" style="margin-top:14px">ВИДЕО ТЕХНИКИ</div>
    <div class="video">
     <iframe src="https://www.youtube-nocookie.com/embed/${exerciseVideos[name]}"
      title="${name} — техника выполнения"
      loading="lazy" allowfullscreen></iframe>
    </div>`
 : "";

 el.innerHTML=`
  <h3>${tag?tag+" · ":""}${name}</h3>
  <div class="meta">${equipment}</div>
  <div class="small">${sets} подхода × ${reps} повторений</div>
  ${video}
  <div class="sets">
   ${Array.from({length:sets},(_,s)=>`
    <label class="set">
     <input type="checkbox" data-set="${s}">
     Подход ${s+1}
    </label>`).join("")}
  </div>
  <div class="weight">
   <span class="small">Рабочий вес:</span>
   <input type="number" min="0" step="0.5" placeholder="кг">
   <span class="small">кг</span>
  </div>
  <details>
   <summary>Техника и работа мышц</summary>
   <div class="guide">
    <div>
     <h4>Работающие мышцы</h4>
     <p>${muscles}</p>
     <h4>Оборудование</h4>
     <p>${equipment}</p>
    </div>
    <div>
     <h4>Основные правила</h4>
     <ul>
      <li>Сохраняй устойчивое положение тела.</li>
      <li>Выполняй движение без рывков.</li>
      <li>Контролируй возвращение веса.</li>
      <li>Не используй инерцию.</li>
     </ul>
     <h4>Дыхание</h4>
     <p>Не задерживай дыхание. Выдыхай на усилии, вдыхай при возвращении.</p>
    </div>
   </div>
  </details>`;

 el.querySelectorAll('input[type="checkbox"]').forEach((c,s)=>{
  c.checked=localStorage.getItem(makeKey(currentDay,index,s))==="1";
  c.addEventListener("change",()=>{
   localStorage.setItem(makeKey(currentDay,index,s),c.checked?"1":"0");
   updateProgress();
  });
 });

 const weight=el.querySelector('input[type="number"]');
 const weightKey=`shox_weight_${currentDay}_${index}`;
 weight.value=localStorage.getItem(weightKey)||"";
 weight.addEventListener("input",()=>{
  localStorage.setItem(weightKey,weight.value);
 });
 return el;
}

function render(){
 const data=workouts[currentDay];
 document.getElementById("dayTitle").textContent=data.title;
 const root=document.getElementById("workout");
 root.innerHTML="";
 const paired=new Set();
 data.supersets.forEach(pair=>pair.forEach(i=>paired.add(i)));

 data.items.forEach((item,i)=>{
  if(paired.has(i)){
   const pair=data.supersets.find(p=>p.includes(i));
   if(pair[0]!==i)return;
   const box=document.createElement("div");
   box.className="superset";
   box.innerHTML='<div class="superset-title">СУПЕРСЕТ · A1 + A2 · ОТДЫХ ПОСЛЕ ОБОИХ УПРАЖНЕНИЙ</div>';
   pair.forEach((idx,n)=>box.appendChild(makeExercise(data.items[idx],idx,n===0?"A1":"A2")));
   root.appendChild(box);
  }else{
   root.appendChild(makeExercise(item,i,""));
  }
 });
 updateProgress();
}

function updateProgress(){
 const data=workouts[currentDay];
 let total=0,done=0;
 data.items.forEach((item,i)=>{
  total+=item[1];
  for(let s=0;s<item[1];s++){
   if(localStorage.getItem(makeKey(currentDay,i,s))==="1")done++;
  }
 });
 document.getElementById("progressText").textContent=`${done} / ${total} подходов`;
 document.getElementById("progressBar").style.width=(done/total*100)+"%";
}

document.querySelectorAll(".tab").forEach(btn=>{
 btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  currentDay=btn.dataset.day;
  render();
 });
});

function showTime(){
 const m=Math.floor(remaining/60),s=remaining%60;
 document.getElementById("clock").textContent=
  String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function stopTimer(){
 if(interval){clearInterval(interval);interval=null;}
}

document.getElementById("duration").addEventListener("change",e=>{
 stopTimer();
 remaining=Number(e.target.value);
 showTime();
});

document.getElementById("start").addEventListener("click",()=>{
 if(interval)return;
 if(remaining<=0)remaining=Number(document.getElementById("duration").value);
 interval=setInterval(()=>{
  remaining--;
  showTime();
  if(remaining<=0){
   stopTimer();
   document.getElementById("clock").textContent="ГОТОВО";
   if("Notification" in window && Notification.permission==="granted"){
    new Notification("SHOX WORKOUT",{body:"Время отдыха закончилось"});
   }
   if(navigator.vibrate)navigator.vibrate([300,150,300]);
   try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=880;
    gain.gain.value=0.15;
    osc.start();
    osc.stop(ctx.currentTime+0.35);
   }catch(e){}
  }
 },1000);
});

document.getElementById("pause").addEventListener("click",stopTimer);

document.getElementById("reset").addEventListener("click",()=>{
 stopTimer();
 remaining=Number(document.getElementById("duration").value);
 showTime();
});

if("Notification" in window && Notification.permission==="default"){
 document.addEventListener("click",()=>{
  if(Notification.permission==="default")Notification.requestPermission();
 },{once:true});
}

render();
showTime();
</script>
</body>
</html>
